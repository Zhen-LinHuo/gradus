<!DOCTYPE html>
<!-- Gradus web installer shell. Vanilla: no framework, no build.
     Theme = one tokens/＜style＞.css; everything reads custom properties. -->
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gradus — GNU Guix System installer</title>
  <link id="style-link" rel="stylesheet" href="tokens/expo.css" />
  <link rel="stylesheet" href="frame.css" />
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <span class="brand">Gradus</span>
      <span class="spacer"></span>
      <label style="font-size:0.85rem">Style
        <select id="style-picker" aria-label="UI style">
          <option value="expo" selected>Expo</option>
          <option value="apple">Apple</option>
          <option value="opencode">OpenCode</option>
          <option value="dell-1996">Dell 1996</option>
        </select>
      </label>
      <label style="font-size:0.85rem">Mode
        <select id="theme-picker" aria-label="Colour mode">
          <option value="light" selected>Light</option>
          <option value="dark">Dark</option>
        </select>
      </label>
    </header>

    <nav class="rail" id="rail" aria-label="Installation steps"></nav>

    <main id="view" aria-live="polite">
      <!-- app.js renders the current step here -->
    </main>

    <footer class="actions">
      <button id="btn-back" type="button">Back</button>
      <span class="spacer" style="flex:1"></span>
      <button id="btn-continue" type="button" class="primary">Continue</button>
    </footer>
  </div>

  <script src="app.js"></script>
</body>
</html>
